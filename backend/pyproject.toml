[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hackyeah26-backend"
version = "0.1.0"
description = "FastAPI backend for the HackYeah26 browser extension"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "fastrtc>=0.0.34,<0.1",
    "numpy>=1.26",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
    "groq>=0.4.0"
]

[project.optional-dependencies]
speech-model = [
    "torch>=2.3",
    "transformers>=4.45",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"